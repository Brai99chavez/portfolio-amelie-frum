<!DOCTYPE html>
<html lang="{{SITE_LANG}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>document.documentElement.classList.add("js");setTimeout(function(){if(!window.__app)document.documentElement.classList.add("no-app");},4000);</script><!-- sin JS, o si app.js no carga, todo el contenido igual se ve -->
  <title>Trabajos — {{SITE_NAME}}</title>
  <meta name="description" content="{{WORKS_DESC}}" />
  <meta name="theme-color" content="#0A0A10" />
  <meta name="color-scheme" content="dark" />
  <!--BUILD:seo-->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0A10'/%3E%3Cpath d='M6 13h20v13H6z' fill='none' stroke='%23B084FF' stroke-width='2'/%3E%3Cpath d='M5 6.5l22-2.2 .7 5L6 11.5z' fill='%23B084FF'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400&family=Instrument+Serif:ital@0;1&display=swap" />
  <link rel="stylesheet" href="assets/css/site.css?v={{V_CSS}}" />
</head>
<body class="page-works">
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <!--BUILD:nav-->

  <!-- página de trabajos: todos los proyectos (con filtro), sus galerías y los créditos -->
  <main id="contenido">
    <section class="section wrap work works" id="trabajo">
      <!--BUILD:workshead-->
      <!--BUILD:filters-->
      <!--BUILD:projects-->
      <!--BUILD:credits-->
    </section>
    <!--BUILD:contact-->
  </main>

  <!--BUILD:footer-->

  <!--BUILD:menu-->

  <dialog class="lb" id="lb" aria-label="Visor de imágenes">
    <button class="lb__btn lb__close" type="button" aria-label="Cerrar">✕</button>
    <button class="lb__btn lb__prev" type="button" aria-label="Imagen anterior">←</button>
    <button class="lb__btn lb__next" type="button" aria-label="Imagen siguiente">→</button>
    <div class="lb__tools" role="group" aria-label="Zoom">
      <button class="lb__btn lb__zoomout" type="button" aria-label="Alejar">−</button>
      <output class="lb__pct mono" aria-label="Nivel de zoom">1×</output>
      <button class="lb__btn lb__zoomin" type="button" aria-label="Acercar">+</button>
      <button class="lb__btn lb__fit" type="button" aria-label="Ajustar a la pantalla" title="Ajustar (0)">⤢</button>
    </div>
    <figure class="lb__fig">
      <img class="lb__img" alt="" />
      <figcaption class="lb__cap mono"></figcaption>
    </figure>
  </dialog>

  <!-- visor de video (la microficción): sin JS, el botón abre el archivo en el navegador -->
  <dialog class="player" id="player" aria-label="Reproductor de video">
    <button class="lb__btn player__close" type="button" aria-label="Cerrar el video">✕</button>
    <video class="player__video" controls playsinline preload="none"></video>
    <p class="player__cap mono"></p>
  </dialog>

  <script src="assets/js/app.js?v={{V_JS}}" defer></script>
</body>
</html>
